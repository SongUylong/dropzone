spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:infra-01}:${POSTGRES_PORT:5432}/dropzone_inventory}
    username: ${POSTGRES_USER:dropzone}
    password: ${POSTGRES_PASSWORD:dropzone_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:infra-01}
      port: ${REDIS_PORT:6379}

server:
  port: 8082
