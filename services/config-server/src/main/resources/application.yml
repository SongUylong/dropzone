server:
  port: 8888

spring:
  application:
    name: CONFIG-SERVER
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO_PATH:classpath:/config-repo,file:${user.dir}/../../config-repo,file:${user.dir}/config-repo}
  profiles:
    active: native

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
