server:
  port: 8088

spring:
  application:
    name: audit-service
  profiles:
    active: development
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
