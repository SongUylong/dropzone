global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'dropzone-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'host.docker.internal:8080' # api-gateway
          - 'host.docker.internal:8081' # user-service
          - 'host.docker.internal:8082' # inventory-service
          - 'host.docker.internal:8083' # order-service
          - 'host.docker.internal:8084' # event-service
          - 'host.docker.internal:8085' # payment-service
          - 'host.docker.internal:8086' # notification-service
          - 'host.docker.internal:8088' # audit-service
          - 'host.docker.internal:8090' # search-service
