---
# Dropzone Multi-Node Staging Ansible Master Provisioning Playbook

# =========================================================================
# 1. ALL SERVERS: Docker, users, folders, system tuning & security
# =========================================================================
- name: Provision All Servers (Docker, Security, Directories)
  hosts: all
  become: true
  tasks:
    - name: Update apt cache and install base packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - software-properties-common
          - git
          - ufw
          - htop
          - jq
        state: present
        update_cache: true

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker Engine & Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker service is enabled and running
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Add vagrant user to docker group
      user:
        name: vagrant
        groups: docker
        append: true

    - name: Create Dropzone base directory structure
      file:
        path: "{{ item }}"
        state: directory
        owner: vagrant
        group: docker
        mode: '0775'
      loop:
        - /opt/dropzone
        - /opt/dropzone/config
        - /opt/dropzone/logs
        - /opt/dropzone/data

    - name: Set sysctl parameters for high concurrency (Flash Sale readiness)
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: true
      loop:
        - { name: 'vm.max_map_count', value: '262144' }
        - { name: 'net.core.somaxconn', value: '1024' }

# =========================================================================
# 2. EDGE SERVER (edge-01): NGINX Ingress Proxy & API Gateway
# =========================================================================
- name: Provision Edge Ingress (edge-01)
  hosts: edge
  become: true
  tasks:
    - name: Create Dropzone edge deployment directory
      file:
        path: /opt/dropzone/edge
        state: directory
        owner: vagrant
        group: docker
        mode: '0775'

    - name: Copy NGINX edge configuration file
      copy:
        src: ../docker/nginx-edge.conf
        dest: /opt/dropzone/edge/nginx-edge.conf
        owner: vagrant
        group: docker
        mode: '0644'

    - name: Copy Edge Docker Compose stack (NGINX + API Gateway)
      copy:
        src: ../docker/docker-compose-edge.yml
        dest: /opt/dropzone/edge/docker-compose.yml
        owner: vagrant
        group: docker
        mode: '0644'

    - name: Ensure Edge services are running via Docker Compose
      community.docker.docker_compose_v2:
        project_src: /opt/dropzone/edge
        state: present

# =========================================================================
# 3. APP SERVERS (app-01, app-02): Microservices Runtime Environment
# =========================================================================
- name: Provision Application Server app-01
  hosts: app-01
  become: true
  tasks:
    - name: Create application deployment directories on app-01
      file:
        path: "{{ item }}"
        state: directory
        owner: vagrant
        group: docker
        mode: '0775'
      loop:
        - /opt/dropzone/apps
        - /opt/dropzone/apps/app1

    - name: Copy app-01 Docker Compose stack (user, event, inventory)
      copy:
        src: ../docker/docker-compose-app1.yml
        dest: /opt/dropzone/apps/app1/docker-compose.yml
        owner: vagrant
        group: docker
        mode: '0644'

    - name: Ensure app-01 microservices are running via Docker Compose
      community.docker.docker_compose_v2:
        project_src: /opt/dropzone/apps/app1
        state: present

- name: Provision Application Server app-02
  hosts: app-02
  become: true
  tasks:
    - name: Create application deployment directories on app-02
      file:
        path: "{{ item }}"
        state: directory
        owner: vagrant
        group: docker
        mode: '0775'
      loop:
        - /opt/dropzone/apps
        - /opt/dropzone/apps/app2

    - name: Copy app-02 Docker Compose stack (order, payment, notification)
      copy:
        src: ../docker/docker-compose-app2.yml
        dest: /opt/dropzone/apps/app2/docker-compose.yml
        owner: vagrant
        group: docker
        mode: '0644'

    - name: Ensure app-02 microservices are running via Docker Compose
      community.docker.docker_compose_v2:
        project_src: /opt/dropzone/apps/app2
        state: present

# =========================================================================
# 4. INFRA SERVER (infra-01): Databases, Messaging & Discovery Services
# =========================================================================
- name: Provision Infrastructure Server (infra-01)
  hosts: infra
  become: true
  tasks:
    - name: Create infrastructure data persistence directories
      file:
        path: "{{ item }}"
        state: directory
        owner: vagrant
        group: docker
        mode: '0777'
      loop:
        - /opt/dropzone/infra
        - /opt/dropzone/infra/postgres
        - /opt/dropzone/infra/redis
        - /opt/dropzone/infra/kafka
        - /opt/dropzone/infra/rabbitmq
        - /opt/dropzone/infra/keycloak
        - /opt/dropzone/infra/docker

    - name: Copy infrastructure Docker Compose file to infra-01
      copy:
        src: ../docker/docker-compose-infra.yml
        dest: /opt/dropzone/infra/docker/docker-compose.yml
        owner: vagrant
        group: docker
        mode: '0644'

    - name: Ensure infrastructure services are running via Docker Compose
      community.docker.docker_compose_v2:
        project_src: /opt/dropzone/infra/docker
        state: present

