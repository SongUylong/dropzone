version: '3.8'

services:
  user-service:
    image: dropzone/user-service:1.4.0
    container_name: dropzone-user-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: staging
      SPRING_CLOUD_CONFIG_URI: http://192.168.56.13:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://192.168.56.13:8761/eureka/
      POSTGRES_HOST: 192.168.56.13
    networks:
      - dropzone-app1-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  event-service:
    image: dropzone/event-service:1.4.0
    container_name: dropzone-event-service
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: staging
      SPRING_CLOUD_CONFIG_URI: http://192.168.56.13:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://192.168.56.13:8761/eureka/
      POSTGRES_HOST: 192.168.56.13
    networks:
      - dropzone-app1-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  inventory-service:
    image: dropzone/inventory-service:1.4.0
    container_name: dropzone-inventory-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: staging
      SPRING_CLOUD_CONFIG_URI: http://192.168.56.13:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://192.168.56.13:8761/eureka/
      POSTGRES_HOST: 192.168.56.13
      REDIS_HOST: 192.168.56.13
    networks:
      - dropzone-app1-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-service-scaled:
    image: dropzone/order-service:1.4.0
    container_name: dropzone-order-service-scaled
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: staging
      SPRING_CLOUD_CONFIG_URI: http://192.168.56.13:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://192.168.56.13:8761/eureka/
      POSTGRES_HOST: 192.168.56.13
      REDIS_HOST: 192.168.56.13
      KAFKA_BOOTSTRAP_SERVERS: 192.168.56.13:9092
    networks:
      - dropzone-app1-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  dropzone-app1-net:
    driver: bridge
