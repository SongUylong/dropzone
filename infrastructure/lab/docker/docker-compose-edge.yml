version: '3.8'

services:
  api-gateway:
    image: dropzone/api-gateway:1.4.0
    container_name: dropzone-api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: staging
      SPRING_CLOUD_CONFIG_URI: http://192.168.56.13:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://192.168.56.13:8761/eureka/
      KEYCLOAK_ISSUER_URI: http://192.168.56.13:8089/realms/dropzone
      KEYCLOAK_JWK_SET_URI: http://192.168.56.13:8089/realms/dropzone/protocol/openid-connect/certs
    networks:
      - dropzone-edge-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: dropzone-nginx-edge
    ports:
      - "80:80"
      - "8000:8000"
    volumes:
      - ./nginx-edge.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - dropzone-edge-net
    restart: unless-stopped

networks:
  dropzone-edge-net:
    driver: bridge
